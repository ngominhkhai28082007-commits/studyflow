<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="head" cx="50%" cy="42%" r="62%">
      <stop offset="60%" stop-color="#F7EAD9"/>
      <stop offset="100%" stop-color="#EAD7BE"/>
    </radialGradient>
    <radialGradient id="body" cx="50%" cy="40%" r="65%">
      <stop offset="60%" stop-color="#F7EAD9"/>
      <stop offset="100%" stop-color="#EAD7BE"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#FFE0A8"/>
      <stop offset="55%" stop-color="#FFB27D"/>
      <stop offset="100%" stop-color="#FF9E7D"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D5C4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g></g>
  
  <!-- body -->
  <ellipse cx="256" cy="352" rx="120" ry="104" fill="url(#body)" stroke="#5B4636" stroke-width="5"/>
