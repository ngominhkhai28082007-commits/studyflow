  <g><g><path transform="translate(150,360) scale(1.0)" opacity="0.95" fill="url(#flame)" d="M0,0 C-26,-30 -18,-66 0,-96 C18,-66 26,-30 0,0 Z"/><path transform="translate(362,360) scale(1.0)" opacity="0.95" fill="url(#flame)" d="M0,0 C-26,-30 -18,-66 0,-96 C18,-66 26,-30 0,0 Z"/><path transform="translate(120,360) scale(0.7)" opacity="0.8" fill="url(#flame)" d="M0,0 C-26,-30 -18,-66 0,-96 C18,-66 26,-30 0,0 Z"/><path transform="translate(392,360) scale(0.7)" opacity="0.8" fill="url(#flame)" d="M0,0 C-26,-30 -18,-66 0,-96 C18,-66 26,-30 0,0 Z"/><path transform="translate(256,360) scale(1.25)" opacity="0.55" fill="url(#flame)" d="M0,0 C-26,-30 -18,-66 0,-96 C18,-66 26,-30 0,0 Z"/></g></g>
  
